name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      VITE_GITHUB_REPOSITORY: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance checks
        run: |
          npm run preview -- --port 4173 > /tmp/oier-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/data/manifest.json > /dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://127.0.0.1:4173 npm run test:ui
      - uses: actions/upload-artifact@v7
        with:
          name: oier-coach-site
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: test-results/
          if-no-files-found: ignore
